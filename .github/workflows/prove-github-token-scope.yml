name: Prove GitHub Token Scope

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prove-token-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Probe GitHub API and public asset access
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          trivy_version="$(cat .trivyversion)"
          trivy_asset="trivy_${trivy_version#v}_Linux-64bit.tar.gz"
          same_repo_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=1"
          other_repo_url="https://api.github.com/repos/aquasecurity/trivy/releases?per_page=1"
          asset_url="https://github.com/aquasecurity/trivy/releases/download/${trivy_version}/${trivy_asset}"

          probe() {
            local label="$1"
            local url="$2"
            shift 2
            local body_file http_code

            body_file="$(mktemp)"
            http_code="$(curl -sS -L -o "$body_file" -w '%{http_code}' "$@" "$url")"

            printf '%s_status=%s\n' "$label" "$http_code" >> "$GITHUB_OUTPUT"
            {
              echo "### ${label}"
              echo
              echo "- URL: ${url}"
              echo "- HTTP status: ${http_code}"
              echo "- Response preview:"
              echo '```text'
              sed -n '1,10p' "$body_file"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            rm -f "$body_file"
          }

          probe same_repo_auth "$same_repo_url" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: github-actions"

          probe other_repo_auth "$other_repo_url" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: github-actions"

          probe other_repo_public "$other_repo_url" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: github-actions"

          probe other_repo_asset "$asset_url" \
            -H "User-Agent: github-actions"

      - name: Assert expected token scope behavior
        env:
          SAME_REPO_AUTH: ${{ steps.probe.outputs.same_repo_auth_status }}
          OTHER_REPO_AUTH: ${{ steps.probe.outputs.other_repo_auth_status }}
          OTHER_REPO_PUBLIC: ${{ steps.probe.outputs.other_repo_public_status }}
          OTHER_REPO_ASSET: ${{ steps.probe.outputs.other_repo_asset_status }}
        run: |
          set -euo pipefail

          echo "same_repo_auth=${SAME_REPO_AUTH}"
          echo "other_repo_auth=${OTHER_REPO_AUTH}"
          echo "other_repo_public=${OTHER_REPO_PUBLIC}"
          echo "other_repo_asset=${OTHER_REPO_ASSET}"

          if [ "$SAME_REPO_AUTH" != "200" ]; then
            echo "Expected same-repo API access with github.token to return 200." >&2
            exit 1
          fi

          if [ "$OTHER_REPO_AUTH" != "403" ]; then
            echo "Expected cross-repo release API access with github.token to return 403." >&2
            exit 1
          fi

          if [ "$OTHER_REPO_ASSET" != "200" ]; then
            echo "Expected the public Trivy asset URL to remain downloadable without github.token." >&2
            exit 1
          fi

          echo "Unauthenticated public releases API status: ${OTHER_REPO_PUBLIC}"
          echo "github.token is repository-scoped: same-repo API works, cross-repo release API does not, and the public asset remains accessible."